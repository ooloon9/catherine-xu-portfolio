<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Drag Grid</title>
  <link rel="stylesheet" href="../css/drag.css" />
</head>
<body>
  <div id="canvas-wrap" class="canvas-wrap">
    <div id="grid-container" class="grid-container"></div>

    <!-- Text lives outside the grid — it's a free-floating overlay -->
    <div id="center-text" class="center-grid-text">
      <span class="label">extras</span>
      <span class="title">drag around<br>to explore</span>
    </div>

    <div id="hint" class="hint">drag to explore</div>
  </div>

  <script src="../javascript/drag.js"></script>
</body>
</html>
